name: Deploy Flutter web to Cloudflare Pages

# Monorepo: this workflow owns app/ only. `defaults.run.working-directory`
# covers the shell steps; the wrangler action is NOT a `run` step, so its
# deploy path is qualified explicitly below.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - '.github/workflows/app-deploy.yml'

defaults:
  run:
    working-directory: app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web Application
        run: flutter build web --release

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `defaults.run.working-directory` does not apply to `uses:` steps,
          # so this path is relative to the repo root, not app/.
          command: pages deploy app/build/web --project-name=road-tracker
