name: Inference CI

# Monorepo: this workflow owns inference/ only. The path filter keeps it from
# running when a Flutter or dashboard change lands, and every step runs from
# inference/ via the defaults below.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'inference/**'
      - '.github/workflows/inference-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'inference/**'
      - '.github/workflows/inference-ci.yml'

defaults:
  run:
    working-directory: inference

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PyYAML pytest pandas numpy

      - name: Run Pytest
        env:
          # Relative to inference/, so the `simulator` package is importable.
          PYTHONPATH: .
        run: pytest tests/

      - name: Generate Synthetic Scenarios
        run: |
          python -m simulator run simulator/scenarios/adversarial.yaml --output out/
          python -m simulator run simulator/scenarios/mixed_real_world.yaml --output out/

      - name: Validate Scenarios
        run: |
          echo "Validating Adversarial Scenario"
          python simulator/validation.py --trace out/adversarial.json --gt out/adversarial_ground_truth.csv > metrics.json

          PRECISION=$(jq -r '.precision' metrics.json)
          RECALL=$(jq -r '.recall' metrics.json)

          # TODO: compare against the main-branch baseline and fail if precision
          # drops >5% or recall >10%. That needs the previous run's metrics.json
          # downloaded as an artifact; today this step only reports.
          echo "Precision: $PRECISION, Recall: $RECALL"

      - name: Comment PR
        uses: mshick/add-pr-comment@v2
        if: github.event_name == 'pull_request'
        with:
          message: |
            **Simulator Metrics**
            - Simulated Adversarial and Mixed Real World
            - See Action logs for detailed Precision/Recall drops.
