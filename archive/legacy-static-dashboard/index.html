<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Quality Global Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Background Map -->
    <div id="map"></div>

    <!-- Glassmorphic Floating Sidebar -->
    <div id="sidebar" class="glass-panel">
        <div class="header">
            <h1>Road Quality Mapper</h1>
            <p class="subtitle">Global Dashboard</p>
        </div>

        <div class="stats-container">
            <div class="stat-box">
                <span class="stat-label">Total Trips Data</span>
                <span class="stat-value" id="total-trips">-</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Total Data Points</span>
                <span class="stat-value" id="total-points">-</span>
            </div>
        </div>

        <div class="legend">
            <h3>Vibration Legend</h3>
            <div class="legend-item">
                <div class="legend-color" style="background: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);"></div>
                <span>High Vibration (> 90th percentile)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);"></div>
                <span>Medium Vibration (> 50th percentile)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);"></div>
                <span>Low Vibration (Smooth)</span>
            </div>
        </div>

        <div class="controls">
            <button id="btn-recenter" class="glass-btn">Recenter Map</button>
        </div>

        <div id="loading" class="loading-state">
            <div class="spinner"></div>
            <span>Fetching secure trip data...</span>
        </div>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module" src="js/app.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</body>
</html>
